<!-- ============================================ -->
<!-- PROFILE PAGE - ROUNDED CURVED UI -->
<!-- ============================================ -->

<div class="profile-page">
  
  <!-- Profile Header - Rounded -->
  <div class="profile-header-card glass-3d">
    <div class="profile-cover">
      <div class="profile-avatar-wrapper">
        <img id="profileViewAvatar" src="https://ui-avatars.com/api/?name=JEE&background=9ca3af&color=fff&size=120" alt="Profile">
        <div class="avatar-status online"></div>
      </div>
      <div class="profile-name-wrapper">
        <h2 id="profileViewName" class="profile-name">User</h2>
        <span class="profile-username" id="profileViewUsername">@username</span>
      </div>
      <button class="edit-profile-btn" id="editProfileBtn">
        <i class="fas fa-pen"></i> Edit Profile
      </button>
    </div>
  </div>
  
  <!-- Profile Stats - Rounded -->
  <div class="profile-stats-grid">
    <div class="stat-card glass-3d">
      <div class="stat-icon blue"><i class="fas fa-check-circle"></i></div>
      <div class="stat-info">
        <span class="stat-number" id="profileDoneQuestions">0</span>
        <span class="stat-label">Done</span>
      </div>
    </div>
    <div class="stat-card glass-3d">
      <div class="stat-icon red"><i class="fas fa-times-circle"></i></div>
      <div class="stat-info">
        <span class="stat-number" id="profileWrongQuestions">0</span>
        <span class="stat-label">Wrong</span>
      </div>
    </div>
    <div class="stat-card glass-3d">
      <div class="stat-icon yellow"><i class="fas fa-flag"></i></div>
      <div class="stat-info">
        <span class="stat-number" id="profileReviewQuestions">0</span>
        <span class="stat-label">Review</span>
      </div>
    </div>
    <div class="stat-card glass-3d">
      <div class="stat-icon orange"><i class="fas fa-fire"></i></div>
      <div class="stat-info">
        <span class="stat-number" id="profileStreak">0</span>
        <span class="stat-label">Streak</span>
      </div>
    </div>
  </div>
  
  <!-- Profile Details - Rounded -->
  <div class="profile-details-card glass-3d">
    <div class="details-header">
      <i class="fas fa-user-circle"></i>
      <span>Personal Details</span>
    </div>
    
    <!-- View Mode -->
    <div id="profileViewMode">
      <div class="detail-item">
        <div class="detail-icon"><i class="fas fa-envelope"></i></div>
        <div class="detail-content">
          <span class="detail-label">Email</span>
          <span class="detail-value" id="profileViewEmail">user@example.com</span>
        </div>
      </div>
      <div class="detail-item">
        <div class="detail-icon"><i class="fas fa-phone"></i></div>
        <div class="detail-content">
          <span class="detail-label">Phone</span>
          <span class="detail-value" id="profileViewPhone">Not set</span>
        </div>
      </div>
      <div class="detail-item">
        <div class="detail-icon"><i class="fas fa-graduation-cap"></i></div>
        <div class="detail-content">
          <span class="detail-label">Class</span>
          <span class="detail-value" id="profileViewClass">Not set</span>
        </div>
      </div>
      <div class="detail-item">
        <div class="detail-icon"><i class="fas fa-bullseye"></i></div>
        <div class="detail-content">
          <span class="detail-label">Target Exam</span>
          <span class="detail-value" id="profileViewExam">JEE Main 2026</span>
        </div>
      </div>
      <div class="detail-item">
        <div class="detail-icon"><i class="fas fa-school"></i></div>
        <div class="detail-content">
          <span class="detail-label">Coaching</span>
          <span class="detail-value" id="profileViewCoaching">Not set</span>
        </div>
      </div>
      <div class="detail-item">
        <div class="detail-icon"><i class="fas fa-flag-checkered"></i></div>
        <div class="detail-content">
          <span class="detail-label">Daily Goal</span>
          <span class="detail-value" id="profileViewDailyGoal">50</span>
        </div>
      </div>
      <div class="detail-item">
        <div class="detail-icon"><i class="fas fa-calendar-plus"></i></div>
        <div class="detail-content">
          <span class="detail-label">Joined</span>
          <span class="detail-value" id="profileViewJoined">Not set</span>
        </div>
      </div>
      <div class="detail-item">
        <div class="detail-icon"><i class="fas fa-sync"></i></div>
        <div class="detail-content">
          <span class="detail-label">Last Sync</span>
          <span class="detail-value" id="profileLastSync">Never</span>
        </div>
      </div>
      <div class="detail-item">
        <div class="detail-icon"><i class="fas fa-code-branch"></i></div>
        <div class="detail-content">
          <span class="detail-label">Version</span>
          <span class="detail-value" id="profileViewVersion">v2.0.0</span>
        </div>
      </div>
    </div>
    
    <!-- Edit Mode -->
    <div id="profileEditMode" class="hidden">
      <div class="profile-edit-avatar">
        <img id="profileEditAvatar" src="https://ui-avatars.com/api/?name=JEE&background=9ca3af&color=fff&size=120" alt="Profile">
        <button class="avatar-edit-btn" id="profileEditAvatarBtn">
          <i class="fas fa-camera"></i>
        </button>
        <input type="file" id="profileEditAvatarInput" accept="image/*" style="display: none;">
      </div>
      
      <div class="edit-form">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Full Name <span style="color: var(--red);">*</span></label>
          <input type="text" id="profileEditName" class="form-input" placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label><i class="fas fa-at"></i> Username <span style="color: var(--red);">*</span></label>
          <div class="username-input-wrapper">
            <span class="username-prefix">@</span>
            <input type="text" id="profileEditUsername" class="form-input" placeholder="username" style="padding-left: 32px;">
          </div>
        </div>
        <div class="form-group">
          <label><i class="fas fa-phone"></i> Phone <span style="color: var(--red);">*</span></label>
          <input type="tel" id="profileEditPhone" class="form-input" placeholder="Enter phone number">
        </div>
        <div class="form-group">
          <label><i class="fas fa-graduation-cap"></i> Class <span style="color: var(--red);">*</span></label>
          <select id="profileEditClass" class="form-input">
            <option value="11th">11th Grade</option>
            <option value="12th">12th Grade</option>
            <option value="dropper">Dropper</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label><i class="fas fa-bullseye"></i> Target Exam</label>
          <select id="profileEditTargetExam" class="form-input">
            <option value="JEE Main 2026">JEE Main 2026</option>
            <option value="JEE Advanced 2026">JEE Advanced 2026</option>
            <option value="JEE Main 2027">JEE Main 2027</option>
            <option value="JEE Advanced 2027">JEE Advanced 2027</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label><i class="fas fa-school"></i> Coaching</label>
          <input type="text" id="profileEditCoaching" class="form-input" placeholder="Enter coaching institute name">
        </div>
        <div class="form-group">
          <label><i class="fas fa-flag-checkered"></i> Daily Goal</label>
          <input type="number" id="profileEditDailyGoal" class="form-input" placeholder="50" min="1" max="500">
        </div>
      </div>
      
      <div class="edit-actions">
        <button class="btn-secondary" id="profileEditCancelBtn">
          <i class="fas fa-times"></i> Cancel
        </button>
        <button class="btn-primary" id="profileEditSaveBtn">
          <i class="fas fa-save"></i> Save Changes
        </button>
      </div>
    </div>
  </div>
  
  <!-- Quick Actions - Rounded -->
  <div class="profile-actions-card glass-3d">
    <div class="actions-header">
      <i class="fas fa-bolt"></i>
      <span>Quick Actions</span>
    </div>
    <div class="actions-grid">
      <button class="action-btn" onclick="showChangePassword()">
        <i class="fas fa-key"></i>
        <span>Change Password</span>
      </button>
      <button class="action-btn" onclick="showDeveloperInfo()">
        <i class="fas fa-code"></i>
        <span>Developer</span>
      </button>
      <button class="action-btn danger" onclick="confirmDeleteAccount()">
        <i class="fas fa-trash-alt"></i>
        <span>Delete Account</span>
      </button>
    </div>
  </div>
  
  <!-- Sync Status - Rounded -->
  <div class="profile-sync-card glass-3d">
    <div class="sync-info">
      <i class="fas fa-cloud" id="profileViewSyncStatus"></i>
      <span>Cloud Sync</span>
    </div>
    <span class="sync-status" id="profileViewSyncStatusText">☁ Local Only</span>
  </div>
  
</div>
