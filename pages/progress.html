<!-- ============================================ -->
<!-- PROGRESS PAGE -->
<!-- ============================================ -->

<div class="page" id="progressPage">
  <h2 class="page-title">
    <i class="fas fa-chart-line"></i> Progress
  </h2>
  <p class="page-subtitle">Click any subject to see detailed progress</p>
  
  <!-- Progress Summary -->
  <div class="progress-summary glass">
    <div class="summary-item">
      <span class="summary-number" id="summaryTotal">0</span>
      <span class="summary-label">Total Qs</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="summary-number" id="summaryDone">0</span>
      <span class="summary-label">Done</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="summary-number" id="summaryWrong">0</span>
      <span class="summary-label">Wrong</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="summary-number" id="summaryReview">0</span>
      <span class="summary-label">Review</span>
    </div>
  </div>

  
  <div id="progressGrid" class="progress-grid"></div>
</div>
